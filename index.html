<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>THINKX Quiz 2026 | AIML Department — INTELLIX</title>
  
  <!-- Favicon using official Intellix logo -->
  <link rel="icon" type="image/png" href="assets/images/intellix-logo.png" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <!-- Subtle Ambient Particle and Grid Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Presentation Viewport Container (100% Locked, No Page Scroll) -->
  <div class="presentation-container">
    
    <!-- Top HUD Header -->
    <header class="hud-header">
      <!-- Left: Official Association Logo & Event Title -->
      <div class="header-left">
        <div class="logo-badge corner-ticks">
          <img src="assets/images/intellix-logo.png" alt="INTELLIX Official Logo" class="intellix-logo-img" />
        </div>
        <div class="brand-separator"></div>
        <div class="event-title-group">
          <div class="event-title">THINKX <span class="event-year">2026</span></div>
          <div class="event-dept">AIML DEPARTMENT • INTELLIX</div>
        </div>
      </div>

      <!-- Center: Active Round / Category Badge -->
      <div class="header-center">
        <div class="round-badge corner-ticks" id="hud-round-badge">
          <span class="round-pulse"></span>
          <span id="hud-round-text">WELCOME</span>
        </div>
      </div>

      <!-- Right: HUD Slide / Question Counter -->
      <div class="header-right">
        <div class="hud-counter-box corner-ticks">
          <span class="hud-counter-label">STATUS</span>
          <span class="hud-counter-current" id="hud-counter-current">START</span>
          <span class="hud-counter-divider">/</span>
          <span class="hud-counter-total" id="hud-counter-total">THINKX</span>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Slide Viewport -->
    <main class="slide-viewport" id="slide-viewport" role="region" aria-live="polite">
      <!-- Dynamic slide content injected via app.js -->
    </main>

    <!-- Bottom Presenter HUD Bar -->
    <footer class="hud-footer">
      <div class="footer-left">
        <div class="footer-brand-tag" id="hud-footer-brand">THINKX • QUIZ</div>
      </div>

      <div class="footer-center">
        <div class="presenter-btn-group">
          <button class="hud-btn" id="btn-prev" title="Previous Slide (Left Arrow / Backspace)">
            <span class="btn-icon">◀</span> PREV
          </button>
          <button class="hud-btn" id="btn-jump" title="Quick Slide Jump (J / G)">
            <span class="btn-icon">☰</span> SLIDES
          </button>
          <button class="hud-btn" id="btn-next" title="Next Slide (Right Arrow / Space / Enter)">
            NEXT <span class="btn-icon">▶</span>
          </button>
          <button class="hud-btn" id="btn-fullscreen" title="Toggle Fullscreen (F)">
            <span class="btn-icon">⛶</span> FULLSCREEN
          </button>
        </div>
      </div>

      <div class="footer-right">
        <div class="shortcut-hints">
          <div class="shortcut-item">
            <span class="shortcut-kbd">SPACE</span>
            <span>NEXT</span>
          </div>
          <div class="shortcut-item">
            <span class="shortcut-kbd">←</span>
            <span>PREV</span>
          </div>
          <div class="shortcut-item">
            <span class="shortcut-kbd">F</span>
            <span>FULLSCREEN</span>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Presenter Slide Quick Jump Drawer / Modal -->
  <div class="jump-drawer-overlay" id="jump-drawer">
    <div class="jump-drawer-box corner-ticks">
      <div class="jump-drawer-header">
        <h2 class="jump-drawer-title">PRESENTER SLIDE NAVIGATOR</h2>
        <button class="hud-btn" id="btn-close-jump">✕ CLOSE</button>
      </div>
      <div id="jump-grid-container">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/quiz-data.js"></script>
  <script src="js/background.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
